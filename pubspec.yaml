name: kogutopedia
description: Dziennik domowego dróbku - Kogutopedia
publish_to: 'none'
version: 0.0.2-alpha

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  path_provider: ^2.1.1
  image_picker: ^1.0.4
  image_cropper: 12.2.1
  intl: ^0.18.1
  google_fonts: ^6.1.0
  uuid: ^4.2.1
  fl_chart: ^0.68.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  http: ^1.6.0
  url_launcher: ^6.3.2
  image: ^4.1.4
  video_compress: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/Tomekbeztlajakoidealnaikonawszedzie.png
    - assets/kogutopediA-logo-i-ikona-apki.png
    - assets/slogan.txt

