name: kogutopedia
description: Dziennik domowego dróbku - Kogutopedia
publish_to: 'none'
version: 0.0.1-alpha

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.1
  image_picker: ^1.0.4
  image_cropper: ^5.0.0
  flutter_image_compress: ^2.1.0
  image: ^4.1.3
  photo_manager: ^2.7.0
  intl: ^0.18.1
  google_fonts: ^6.1.0
  uuid: ^4.2.1
  exif: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.0
  isar_generator: ^3.1.0
  riverpod_generator: ^2.3.0
  riverpod_lint: ^2.3.0

flutter:
  uses-material-design: true
  fonts:
    - family: Exo2
      fonts:
        - asset: assets/fonts/Exo2-VariableFont_wght.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-VariableFont_wght.ttf
